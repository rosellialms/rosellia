  --blue-s:rgba(29,95,209,.13); --purple-s:rgba(109,63,196,.13); --rose-s:rgba(178,58,90,.13); --gold-s:rgba(148,101,22,.16);

}
html[data-theme="dark"]{

  --glass:#20141c; --glass2:#2b1d27; --edge:#3d2b37;

  --green:#5fe08f; --red:#ff8a8a; --amber:#ffc266; --blue:#8ab6ff; --purple:#c3a6ff;
  --green-s:rgba(95,224,143,.15); --red-s:rgba(255,138,138,.16); --amber-s:rgba(255,194,102,.16);
  --blue-s:rgba(138,182,255,.16); --purple-s:rgba(195,166,255,.16); --rose-s:rgba(243,164,182,.16); --gold-s:rgba(232,200,142,.16);
  --b1:rgba(200,60,105,.55); --b2:rgba(110,60,180,.45); --b3:rgba(205,140,60,.34);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom);font-size:14px;line-height:1.45;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:18px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:13px;
  border:1px solid var(--edge);background:var(--field);color:var(--text);outline:none;
  }
input,select{min-width:0}
.g2>*,.g3>*{min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--rose);box-shadow:none;padding:0}
input[type=file]{font-size:13px;padding:9px}
select option{background:#fff;color:#33161f}
html[data-theme="dark"] select option{background:#2a1722;color:#f7ecef}
html[data-theme="dark"] input[type=date]{color-scheme:dark}
textarea{min-height:74px;resize:vertical}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.6px}
label b{color:var(--red)}
.hide{display:none!important}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.3px}

header{position:sticky;top:0;z-index:50;margin:8px 10px 0;padding:9px 12px;display:flex;align-items:center;gap:9px;border-radius:18px}
#hdrTitle{min-width:0}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:23px;letter-spacing:1.5px;
  background:linear-gradient(90deg,var(--rose),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hspacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--glass2);display:flex;align-items:center;justify-content:center;border:1px solid var(--edge);flex:none}
.userchip{font-size:11px;font-weight:700;padding:8px 11px;border-radius:999px;background:var(--rose-s);color:var(--rose);white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}

.page{max-width:820px;margin:0 auto;padding:14px 12px 60px}
.login-wrap{max-width:390px;margin:11vh auto;padding:20px}
.login-card{padding:30px 26px}
.login-card h1{font-size:40px;letter-spacing:3px;background:linear-gradient(90deg,var(--rose),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:12.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13.5px;padding:12px 17px;border-radius:14px;
  border:1px solid var(--edge);background:var(--glass2);}
.btn:active{opacity:.7}
.btn-block{width:100%}
.btn-rose{background:linear-gradient(135deg,#d0577a,#8f2b4c);color:#fff;border-color:rgba(255,255,255,.3)}
.btn-green{background:linear-gradient(135deg,#27b765,#127a3f);color:#fff;border-color:rgba(255,255,255,.3)}
.btn-red{background:linear-gradient(135deg,#e25555,#a52222);color:#fff;border-color:rgba(255,255,255,.3)}
.btn-gold{background:linear-gradient(135deg,#e2bd7c,#a8792c);color:#2a1a08;border-color:rgba(255,255,255,.4)}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:11px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1 1 auto}

.notif{padding:12px 14px;margin-bottom:9px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:16px}
.n-red{color:var(--red);background:var(--red-s)} .n-amber{color:var(--amber);background:var(--amber-s)}
.n-blue{color:var(--blue);background:var(--blue-s)} .n-green{color:var(--green);background:var(--green-s)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{padding:12px 8px;text-align:center;border-radius:16px}
.stat b{display:block;font-size:22px;font-family:'Cormorant Garamond',serif;font-weight:700}
.stat span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.mod{position:relative;padding:16px 14px;cursor:pointer}
.mod:active{opacity:.75}
.mod .mico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.mod h3{font-size:14px;font-weight:700}
.mod p{font-size:11px;color:var(--muted);margin-top:2px}
.mod .badge{position:absolute;top:11px;right:11px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#d43c3c;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.c-rose .mico{background:var(--rose-s);color:var(--rose)} .c-gold .mico{background:var(--gold-s);color:var(--gold)}
.c-green .mico{background:var(--green-s);color:var(--green)} .c-red .mico{background:var(--red-s);color:var(--red)}
.c-blue .mico{background:var(--blue-s);color:var(--blue)} .c-purple .mico{background:var(--purple-s);color:var(--purple)}
.c-amber .mico{background:var(--amber-s);color:var(--amber)}

.tabs{display:flex;gap:7px;margin:2px 0 12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;background:var(--glass);border:1px solid var(--edge);white-space:nowrap;color:var(--muted)}
.tab.on{background:linear-gradient(135deg,#d0577a,#8f2b4c);color:#fff;border-color:rgba(255,255,255,.3)}
.card{padding:14px;margin-bottom:10px;border-radius:18px}
.card.click{cursor:pointer}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.title{font-weight:700;font-size:15px}
.chip{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.4px;white-space:nowrap;display:inline-block}
.ch-green{background:var(--green-s);color:var(--green)} .ch-red{background:var(--red-s);color:var(--red)}
.ch-amber{background:var(--amber-s);color:var(--amber)} .ch-blue{background:var(--blue-s);color:var(--blue)}
.ch-purple{background:var(--purple-s);color:var(--purple)} .ch-rose{background:var(--rose-s);color:var(--rose)}
.ch-gold{background:var(--gold-s);color:var(--gold)} .ch-gray{background:var(--line);color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);margin-top:5px}
.meta b{color:var(--text);font-weight:600}
.hint{font-size:12px;font-weight:600;margin-top:7px;padding:8px 10px;border-radius:11px}
.h-red{background:var(--red-s);color:var(--red)} .h-green{background:var(--green-s);color:var(--green)} .h-amber{background:var(--amber-s);color:var(--amber)}
.sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin:18px 2px 8px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:420px){.g3{grid-template-columns:1fr 1fr}}
.evbox{padding:12px;border-radius:16px;margin-bottom:10px;border:1px dashed var(--line);background:var(--glass)}
.evname{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:24px;line-height:1.1}
.evgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.evt{padding:9px 11px;border-radius:13px;background:var(--glass2);border:1px solid var(--edge);min-width:0}
.evt.wide{grid-column:span 2}
.evt span{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.evt b{display:block;font-size:15.5px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.evt.miss b{color:var(--amber);font-weight:600}
.evl{color:var(--text)!important;font-size:13px!important}
.evr{display:flex;gap:11px;align-items:center;margin-top:10px}
.dbox{flex:none;width:62px;text-align:center;border-radius:13px;background:var(--rose-s);color:var(--rose);padding:6px 2px 7px;line-height:1.05}
.dbox small{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.dbox b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;font-weight:700}
.dbox.none{background:var(--amber-s);color:var(--amber);padding:11px 2px}
.dbox.past{background:var(--line);color:var(--muted)}
.evr .et{font-weight:700;font-size:14.5px}
.evr .ed{font-size:12.5px;color:var(--muted);margin-top:2px}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.xgrid{grid-template-columns:1fr}}
.xrow{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border:1px solid var(--edge);border-radius:13px;background:var(--glass2)}
.xrow span{flex:1;font-weight:600;font-size:13.5px}
.yn{display:flex;gap:5px}
.yn button{padding:8px 15px;border-radius:10px;border:1px solid var(--edge);font-weight:700;font-size:12.5px;color:var(--muted);background:var(--glass)}
.yn button.y.on{background:#1f9d55;border-color:#1f9d55;color:#fff}
.yn button.n.on{background:#c53030;border-color:#c53030;color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv span{color:var(--muted)} .kv b{font-weight:600;text-align:right;word-break:break-word}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;padding-bottom:14px}

.rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:6px}
.rm{padding:10px 4px;border-radius:12px;text-align:center;font-weight:700;font-size:13px;background:var(--green-s);color:var(--green);border:1.5px solid transparent}

.rgridwrap{overflow-x:auto;border-radius:16px;padding:8px}
table.rgrid{border-collapse:separate;border-spacing:2px;font-size:11px}
table.rgrid th{font-weight:700;color:var(--muted);padding:3px 0;min-width:26px;text-align:center}
table.rgrid th.we{color:var(--rose)}
table.rgrid td{height:26px;min-width:26px;border-radius:6px;background:var(--green-s);text-align:center}
table.rgrid td.bk{background:#d0577a;cursor:pointer}
table.rgrid td.rn,table.rgrid th.rn{position:sticky;left:0;background:var(--bg);font-weight:700;padding:0 8px;min-width:62px;text-align:left;z-index:2;border-radius:6px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d0577a,#d8a646);border-radius:5px}

.modal-bg{position:fixed;inset:0;background:rgba(10,4,8,.68);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:680px;max-height:93vh;overflow-y:auto;overscroll-behavior:contain;padding:20px 16px calc(22px + env(safe-area-inset-bottom));
  border-radius:24px 24px 0 0;background:var(--bg);border:1px solid var(--edge);box-shadow:0 -10px 40px var(--shadow)}
html[data-theme="dark"] .modal{background:#21131d}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:24px}}
.modal h2{font-size:25px;margin-bottom:6px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;
  font-size:13px;font-weight:600;z-index:300;max-width:92vw;text-align:center;box-shadow:0 8px 30px var(--shadow)}
.spin{border:3px solid var(--line);border-top-color:var(--rose);border-radius:50%;width:30px;height:30px;margin:60px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.imgview{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
.imgview img{max-width:100%;max-height:100%}
</style>
</head>

/* ---------- follow-up rule (based on days left to the event) ---------- */
function nearestEvent(l){const t=T();return (l.lead_events||[]).map(e=>e.event_date).filter(d=>d&&d>=t).sort()[0]||null;}
function fuGap(days){if(days==null||days>60)return 7;if(days>=30)return 3;if(days>=15)return 2;return 1;}
function autoNextFromEvents(evs){const t=T();const d=evs.map(e=>e.event_date).filter(x=>x&&x>=t).sort()[0];return addDays(t,fuGap(d?diff(t,d):null));}
function fuState(l){if(l.status!=="ACTIVE")return null;if(!l.next_followup)return{k:"today",late:0,none:true};
  const late=diff(l.next_followup,T());return {k:late<0?"upcoming":late===0?"today":late<=2?"overdue":"missed",late};}
function daysLeftChip(l){const d=nearestEvent(l);if(!d)return `<span class="chip ch-gray">DATE NOT FINAL</span>`;
  const n=diff(T(),d);return `<span class="chip ${n<15?"ch-red":n<30?"ch-amber":n<=60?"ch-blue":"ch-green"}">${leftTxt(n).toUpperCase()}</span>`;}
function fuChip(l){const s=fuState(l);if(!s)return"";
  if(s.none)return `<span class="chip ch-amber">NO FOLLOW-UP SET</span>`;
  if(s.k==="upcoming")return `<span class="chip ch-gray">CALL ${fmtDs(l.next_followup).toUpperCase()}</span>`;
  if(s.k==="today")return `<span class="chip ch-amber">CALL TODAY</span>`;
  return `<span class="chip ch-red">${s.k==="missed"?"MISSED":"OVERDUE"} ${s.late}D</span>`;}

/* ---------- availability ---------- */
function hallClash(date,session,hall,exBid){const out=[];if(!date||!hall)return out;
  for(const b of bookings){if(b.id===exBid||b.status==="CANCELLED")continue;
    for(const e of b.booking_events||[]){if(!e.active||e.event_date!==date)continue;
      if((e.hall===hall||e.hall==="BOTH"||hall==="BOTH")&&(e.session===session||e.session==="FULL DAY"||session==="FULL DAY"))out.push({b,e});}}
  return out;}
function enquiriesOn(date,exLead){return leads.filter(l=>l.status==="ACTIVE"&&l.id!==exLead&&(l.lead_events||[]).some(e=>e.event_date===date));}
function roomsTaken(ci,co,exBid){const m={};if(!ci||!co)return m;
  for(const b of bookings){if(b.status==="CANCELLED"||b.id===exBid)continue;
    for(const r of b.room_allocations||[])if(r.active&&r.check_in<co&&r.check_out>ci)m[r.room_no]=b;}
  return m;}
function availHint(e,exBid,exLead){if(!e.event_date)return"";let h="";
  const venue=e.venue||e.hall;
  if(venue){const c=hallClash(e.event_date,e.session,venue,exBid);
    if(c.length)h+=`<div class="hint h-red">${icn("alert",15)} ALREADY BOOKED: ${c.map(x=>`${esc(HALLS[x.e.hall].name)}, ${cap(x.e.session)} by ${esc(x.b.customer_name)} (${esc(x.b.booking_no)})`).join("; ")}</div>`;
    else h+=`<div class="hint h-green">${icn("check",15)} ${esc(HALLS[venue].name)} is free for ${cap(e.session)} on ${fmtD(e.event_date)}</div>`;
    const g=num(e.guests);if(g&&g>HALLS[venue].cap)h+=`<div class="hint h-amber">${g} guests is above ${esc(HALLS[venue].name)} capacity (${HALLS[venue].cap})</div>`;}
  const q=enquiriesOn(e.event_date,exLead);
  if(q.length)h+=`<div class="hint h-amber">${q.length} other open enquir${q.length>1?"ies":"y"} for this date: ${q.slice(0,3).map(l=>esc(l.customer_name)).join(", ")}</div>`;
  return h;}

/* Supabase returns at most 1000 rows per request, so big tables are read page by page */
async function fetchAll(make){let out=[];for(let from=0;;from+=1000){const {data,error}=await make().range(from,from+999);if(error)return{data:out,error};out=out.concat(data||[]);if(!data||data.length<1000)break;}return{data:out};}
async function loadData(){
  const [p,l,b,s]=await Promise.all([
    sb.from("profiles").select("*").order("name"),
    fetchAll(()=>sb.from("leads").select("*, lead_events(*)").order("created_at",{ascending:false}).order("id")),
    fetchAll(()=>sb.from("bookings").select("*, booking_events(*), room_allocations(*), payments(*)").order("created_at",{ascending:false}).order("id")),
    sb.from("settings").select("*")]);
  if(l.error)toast(l.error.message);
  profiles=p.data||[];leads=l.data||[];bookings=b.data||[];
  const sv=k=>(s.data||[]).find(r=>r.key===k)?.value;BIZ=sv("business")||{};BACKUP=sv("backup")||null;
  const mine=profiles.find(x=>x.id===me.id);if(mine)me=mine;
  for(const x of leads)(x.lead_events||[]).sort((a,c)=>a.sort-c.sort);
  for(const x of bookings){(x.booking_events||[]).sort((a,c)=>a.sort-c.sort);(x.room_allocations||[]).sort((a,c)=>a.room_no-c.room_no);(x.payments||[]).sort((a,c)=>a.created_at<c.created_at?-1:1);}
}
let rtTimer=null;
function subscribeRealtime(){
  if(rtChannel)sb.removeChannel(rtChannel);
  const hit=()=>{clearTimeout(rtTimer);rtTimer=setTimeout(async()=>{await loadData();softRender();},500);};
  let ch=sb.channel("rosellia");
  for(const t of ["leads","lead_events","followups","bookings","booking_events","room_allocations","payments","profiles","settings"])
    ch=ch.on("postgres_changes",{event:"*",schema:"public",table:t},hit);
  rtChannel=ch.subscribe();
}

async function compressImage(file,maxKB=350){
  const img=await createImageBitmap(file);let w=img.width,h=img.height;const maxDim=1800;
  if(Math.max(w,h)>maxDim){const s=maxDim/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
  let q=0.85,blob;
  for(let i=0;i<8;i++){blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(blob.size<=maxKB*1024)break;q-=0.13;
    if(q<0.35){c.width=Math.round(c.width*0.8);c.height=Math.round(c.height*0.8);c.getContext("2d").drawImage(img,0,0,c.width,c.height);q=0.72;}}
  return blob;}
async function uploadFiles(leadId,files,kind,followupId){let ok=0;
  for(const f of files){let blob=f,ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,""),mime=f.type||"application/octet-stream";
    if(mime.startsWith("image/")){try{blob=await compressImage(f);ext="jpg";mime="image/jpeg";}catch(e){}}
    else if(f.size>20*1024*1024){toast(f.name+" is bigger than 20 MB, skipped");continue;}
    const path=`${leadId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:mime});
    if(error){toast("Upload failed: "+error.message);continue;}
    const k=kind||(mime.startsWith("audio/")?"CALL RECORDING":mime.startsWith("image/")?"WHATSAPP CHAT":"OTHER");
    const r=await sb.from("attachments").insert({lead_id:leadId,followup_id:followupId||null,kind:k,path,name:f.name,mime,size:blob.size});
    if(r.error)toast(r.error.message);else ok++;}
  return ok;}
function attHtml(list,urls){if(!list.length)return"";
  return `<div class="thumbs">${list.map(a=>{const u=urls[a.path];if(!u)return"";
    if((a.mime||"").startsWith("image/"))return `<img src="${u}" alt="${esc(a.kind)}" title="${esc(cap(a.kind))}" onclick="viewImg(this.src)">`;
    if((a.mime||"").startsWith("audio/")||(a.mime||"").startsWith("video/"))return `<audio controls preload="none" src="${u}"></audio>`;
    return `<a class="filelink" href="${u}" target="_blank" rel="noopener">${icn("file",14)} ${esc(a.name||cap(a.kind))}</a>`;}).join("")}</div>`;}

async function addLeadFiles(id){const files=[...$("ldAttFile").files];if(!files.length||lock())return;

async function leadUpdate(id,patch,logNote,kind){
  const {error}=await sb.from("leads").update(patch).eq("id",id);if(error){toast(error.message);return false;}
  if(logNote)await sb.from("followups").insert({lead_id:id,kind:kind||"SYSTEM",note:logNote,sub_status:patch.sub_status||null,by_name:me.name});
  await refresh();return true;}
async function setSub(id,val){const l=leadById(id);
  if(val==="CUSTOMER EXPECTATION"){modal(`<h2>Customer expectation</h2><p class="sub">Write the custom requirements this customer has asked for.</p>

    <div class="btnrow"><button class="btn" onclick="closeModal();renderLead()">Cancel</button><button class="btn btn-rose" onclick="saveExpect('${id}')">Save</button></div>`);return;}

  if(await leadUpdate(id,{sub_status:val},"Status changed to "+cap(val)))toast("Status updated");}
async function saveExpect(id){const v=$("exTxt").value.trim();if(!v)return toast("Write the requirements");
  closeModal();await leadUpdate(id,{sub_status:"CUSTOMER EXPECTATION",expectations:v},"Customer expectation: "+v,"NOTE");}
async function assignLead(id,uid){if(await leadUpdate(id,{assigned_to:uid||null},"Assigned to "+pname(uid)))toast("Lead assigned to "+pname(uid));}
async function reopenLead(id){if(!confirm("Reopen this lead and move it back to Active?"))return;const l=leadById(id);
  await leadUpdate(id,{status:"ACTIVE",sub_status:"FOLLOW UP SCHEDULED",lost_reason:null,lost_note:null,lost_at:null,next_followup:autoNextFromEvents(l.lead_events||[])},"Lead reopened");}
async function deleteLead(id){const l=leadById(id);if(!confirm("Delete "+l.lead_no+" ("+l.customer_name+") with all its history and files? This cannot be undone."))return;
  const {data:at}=await sb.from("attachments").select("path").eq("lead_id",id);

  const {error}=await sb.from("leads").delete().eq("id",id);if(error)return toast(error.message);

/* ---------- follow-up ---------- */
function fuModal(id,forceSub){const l=leadById(id);if(!l)return;
  const next=autoNextFromEvents(l.lead_events||[]),d=nearestEvent(l),left=d?diff(T(),d):null;
  const sub=forceSub||(["NEW ENQUIRY","CONTACTED"].includes(l.sub_status)?"FOLLOW UP SCHEDULED":l.sub_status);
  modal(`<h2>Log follow-up</h2><p class="sub">${esc(l.customer_name)} · ${esc(l.lead_no)} · ${left==null?"event date not final":left+" days to event"}</p>
    <div class="g2"><div><label>Type</label><select id="fuKind">${opts(["CALL","WHATSAPP","VISIT","NOTE"],"CALL")}</select></div>
    <div><label>Sub status after this</label><select id="fuSub">${opts(SUBS,sub)}</select></div></div>
    <label>What did the customer say?</label><textarea id="fuNote" placeholder="Short note of the conversation"></textarea>
    <label>Next follow-up call</label><input type="date" id="fuNext" value="${next}" min="${T()}">
    <div class="sub" style="margin-top:6px">Auto rule: ${left==null?"date not final, call every 7 days":left>60?"more than 60 days left, call every 7 days":left>=30?"30 to 60 days left, call every 3 days":left>=15?"15 to 30 days left, call every 2 days":"less than 15 days left, call daily"}.</div>
    <label>Call recording or WhatsApp chat screenshots</label><input type="file" id="fuFiles" accept="audio/*,image/*,video/mp4,.amr,.m4a,.mp3,.aac,.ogg,.wav" multiple>
    <div class="btnrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-rose" onclick="saveFu('${id}')">Save follow-up</button></div>`);}
async function saveFu(id){
  const note=$("fuNote").value.trim(),sub=$("fuSub").value,next=$("fuNext").value,kind=$("fuKind").value,files=[...$("fuFiles").files];
  if(!note&&!files.length)return toast("Write a short note or attach a file");
  if(!next)return toast("Set the next follow-up date");
  if(lock())return;
  try{
    const {data:fu,error}=await sb.from("followups").insert({lead_id:id,kind,note:note||null,sub_status:sub,next_followup:next,by_name:me.name}).select().single();
    if(error)throw error;
    if(files.length){toast("Uploading");await uploadFiles(id,files,null,fu.id);}
    const l=leadById(id);const patch={sub_status:sub,next_followup:next,last_contact_at:new Date().toISOString()};
    if(sub==="CUSTOMER EXPECTATION"&&note)patch.expectations=(l.expectations?l.expectations+"\n":"")+note;
    const r=await sb.from("leads").update(patch).eq("id",id);if(r.error)throw r.error;
    closeModal();await refresh();toast("Follow-up saved. Next call "+fmtDs(next));
  }catch(e){toast(e.message||"Could not save");}finally{unlock();}
}

/* ================= CONVERT TO BOOKING / EDIT BOOKING ================= */
let BF=null;
function openConvert(id){const l=leadById(id);if(!l)return;
  const evs=(l.lead_events||[]).map(e=>({event_type:e.event_type,event_date:e.event_date||"",session:e.session,hall:e.venue||"",guests:e.guests??"",menu:e.menu||""}));
  const dates=evs.map(e=>e.event_date).filter(Boolean).sort();
  const need=(l.lead_events||[]).reduce((s,e)=>Math.max(s,e.rooms||0),0);
  BF={mode:"convert",lead:l,extras:{...(l.extras||{})},booking_date:T(),total:l.offered_price??"",notes:l.expectations||"",advance:"",adv_mode:"CASH",events:evs.length?evs:[{event_type:"",event_date:"",session:"DINNER",hall:"",guests:"",menu:""}],
      ci:dates.length?addDays(dates[0],need?-1:0):"",co:dates.length?addDays(dates[dates.length-1],1):"",rooms:new Set(),need,autoPick:need>0};
  renderBF();}
function openEditBooking(id){const b=bkById(id);if(!b)return;
  BF={mode:"edit",booking:b,extras:{...(b.extras||{})},booking_date:b.booking_date,total:b.total_amount,notes:b.custom_notes||"",
      events:(b.booking_events||[]).filter(e=>e.active).map(e=>({id:e.id,event_type:e.event_type,event_date:e.event_date,session:e.session,hall:e.hall,guests:e.guests??"",menu:e.menu||""}))};
  renderBF();}
function bfRead(){if(!BF||!$("bfDate"))return;
  BF.booking_date=$("bfDate").value;BF.total=$("bfTotal").value;BF.notes=$("bfNotes").value;
  if(BF.mode==="convert"){BF.advance=$("bfAdv").value;BF.adv_mode=$("bfAdvMode").value;
    if($("bfCi").value!==BF.ci||$("bfCo").value!==BF.co){BF.ci=$("bfCi").value;BF.co=$("bfCo").value;}}
  BF.events.forEach((e,i)=>{e.event_type=$("be"+i+"type").value.trim().toUpperCase();e.event_date=$("be"+i+"date").value;e.session=$("be"+i+"ses").value;
    e.hall=$("be"+i+"hall").value;e.guests=$("be"+i+"g").value;e.menu=$("be"+i+"menu").value;});}
function bfRe(){if(reBusy)return;reBusy=true;try{settle();bfRead();renderBF();}finally{reBusy=false;}}
function bfToggleRoom(n){settle();bfRead();BF.autoPick=false;if(BF.rooms.has(n))BF.rooms.delete(n);else BF.rooms.add(n);renderBF();}
function bfClashes(){const exB=BF.mode==="edit"?BF.booking.id:null;const out=[];
  BF.events.forEach((e,i)=>{if(e.event_date&&e.hall){if(hallClash(e.event_date,e.session,e.hall,exB).length)out.push(i);
    BF.events.forEach((o,j)=>{if(j<i&&o.event_date===e.event_date&&(o.hall===e.hall||o.hall==="BOTH"||e.hall==="BOTH")&&(o.session===e.session||o.session==="FULL DAY"||e.session==="FULL DAY"))out.push(i);});}});
  return out;}

      ${f.need&&f.rooms.size<f.need?`<div class="hint h-amber">Customer asked for ${f.need} rooms, only ${f.rooms.size} selected.</div>`:""}`

    <div><label>Booking amount (₹) <b>*</b></label><input type="number" inputmode="numeric" id="bfTotal" value="${esc(f.total)}"></div></div>
    <div class="sec">Events</div>
    ${f.events.map((e,i)=>`<div class="evbox">
      <div class="g2"><div><label>Event <b>*</b></label><input id="be${i}type" value="${esc(e.event_type)}" list="evTypes"></div>
      <div><label>Event date <b>*</b></label><input type="date" id="be${i}date" value="${esc(e.event_date)}" onchange="bfRe()"></div></div>

      <div class="g2"><div><label>Guests</label><input type="number" inputmode="numeric" id="be${i}g" value="${esc(e.guests)}"></div>
      <div><label>Menu <b>*</b></label><select id="be${i}menu">${opts(MENUS,e.menu,"Select menu")}</select></div></div>
      ${clash.includes(i)&&!hallClash(e.event_date,e.session,e.hall,exB).length?`<div class="hint h-red">${icn("alert",15)} Same hall and time is used twice in this booking</div>`:availHint(e,exB,conv?f.lead.id:f.booking.lead_id)}
      ${f.events.length>1?`<div class="btnrow"><button class="btn btn-sm" onclick="settle();bfRead();BF.events.splice(${i},1);renderBF()">Remove this event</button></div>`:""}
    </div>`).join("")}

    ${conv?`<div class="sec">Advance received now (optional)</div>

      <button class="btn btn-green" onclick="saveBF()">${conv?"Confirm booking":"Save changes"}</button></div>`);

async function saveBF(){
  settle();bfRead();const f=BF;
  if(!f.booking_date)return toast("Booking date is mandatory");
  const total=num(f.total);if(total==null||total<0)return toast("Booking amount is mandatory");
  if(!f.events.length)return toast("Add at least one event");
  for(const [i,e] of f.events.entries()){const n=f.events.length>1?" (event "+(i+1)+")":"";
    if(!e.event_type)return toast("Event name is mandatory"+n);if(!e.event_date)return toast("Event date is mandatory"+n);
    if(!e.hall)return toast("Select the hall"+n);if(!e.menu)return toast("Select the menu"+n);}
  if(bfClashes().length)return toast("Hall already booked. Change date, hall or session.");
  if(lock())return;
  try{
    if(f.mode==="convert"){
      if(f.rooms.size&&!(f.ci&&f.co&&f.co>f.ci))throw new Error("Check-out must be after check-in");
      const payload={lead_id:f.lead.id,booking_date:f.booking_date,total_amount:String(total),custom_notes:f.notes.trim(),extras:extrasClean(f.extras),advance:String(num(f.advance)||""),advance_mode:f.adv_mode,
        events:f.events.map(e=>({event_type:e.event_type,event_date:e.event_date,session:e.session,hall:e.hall,guests:String(num(e.guests)??""),menu:e.menu})),
        rooms:[...f.rooms].sort((a,b)=>a-b).map(n=>({room_no:n,check_in:f.ci,check_out:f.co}))};
      const {data,error}=await sb.rpc("convert_lead",{p:payload});if(error)throw error;
      $("modalHost").innerHTML="";BF=null;await loadData();
      history.replaceState({t:"view",v:"booking",arg:data},"","#booking");view="booking";viewArg=data;renderView();
      confirmedModal(data);
    }else{
      const b=f.booking;
      let r=await sb.from("bookings").update({booking_date:f.booking_date,total_amount:total,custom_notes:f.notes.trim()||null,extras:extrasClean(f.extras)}).eq("id",b.id);if(r.error)throw r.error;
      const keep=f.events.filter(e=>e.id).map(e=>e.id);
      for(const old of (b.booking_events||[]).filter(e=>e.active&&!keep.includes(e.id))){r=await sb.from("booking_events").delete().eq("id",old.id);if(r.error)throw r.error;}
      for(const [i,e] of f.events.entries()){const row={event_type:e.event_type,event_date:e.event_date,session:e.session,hall:e.hall,guests:num(e.guests),menu:e.menu,sort:i};
        r=e.id?await sb.from("booking_events").update(row).eq("id",e.id):await sb.from("booking_events").insert({...row,booking_id:b.id});if(r.error)throw r.error;}
      closeModal();BF=null;await refresh();toast("Booking updated");
    }
  }catch(e){toast(e.message||"Could not save");await loadData();if(BF)renderBF();}
  finally{unlock();}
}

  doc.setTextColor(255,255,255);doc.setFont("times","bold");doc.setFontSize(28);doc.text(ascii((BIZ.name||"ROSELLIA").toUpperCase()),M,19,{charSpace:1.6});
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(236,208,160);doc.text(ascii(BIZ.tagline||"Banquets & Suites"),M,26.5);
  doc.setTextColor(255,255,255);doc.setFontSize(8.5);
  const head=[...ascii(BIZ.address||"").split("\n").filter(Boolean),BIZ.phone?"Phone: "+ascii(BIZ.phone):"",BIZ.gstin?"GSTIN: "+ascii(BIZ.gstin):""].filter(Boolean).slice(0,5);
  head.forEach((t,i)=>doc.text(t,W-M,11+i*4.6,{align:"right"}));
}
function buildPDF(kind,o,x){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});const W=210,M=14;
  pdfHeader(doc,W,M);
  const evs0=kind==="QUOTE"||(o.booking_events||[]).some(e=>e.active);
  let y=48;doc.setTextColor(110,32,58);doc.setFont("times","bold");doc.setFontSize(17);
  doc.text(kind==="QUOTE"?"QUOTATION":!evs0?"ROOM BOOKING CONFIRMATION":"BOOKING CONFIRMATION",M,y);
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(60,60,60);
  doc.text((kind==="QUOTE"?"Quotation No: ":"Booking Ref: ")+(o.lead_no||o.booking_no),W-M,y-4,{align:"right"});
  doc.text("Date: "+fmtD(kind==="QUOTE"?T():o.booking_date),W-M,y+1,{align:"right"});
  y+=9;doc.setDrawColor(220,205,190);doc.line(M,y,W-M,y);y+=7;
  doc.setFontSize(9);doc.setTextColor(120,120,120);doc.text("CUSTOMER",M,y);y+=5.5;
  doc.setFontSize(12.5);doc.setTextColor(30,30,30);doc.setFont("helvetica","bold");doc.text(ascii(o.customer_name)||"Customer",M,y);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text("Mobile: "+o.mobile+(o.alt_mobile?" / "+o.alt_mobile:""),M,y+5.5);y+=12;
  const hs={fillColor:[110,32,58],textColor:255,fontStyle:"bold",fontSize:9},st={fontSize:9.5,cellPadding:2.6,lineColor:[225,212,200],lineWidth:0.2};
  const evs=kind==="QUOTE"?(o.lead_events||[]):(o.booking_events||[]).filter(e=>e.active);
  if(evs.length)doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",headStyles:hs,styles:st,
    head:[["Event","Date","Session","Hall","Guests","Menu"]],
    body:evs.map(e=>[ascii(cap(e.event_type)),fmtD(e.event_date),cap(e.session),(e.venue||e.hall)?HALLS[e.venue||e.hall].name:"To be decided",e.guests||"-",e.menu?cap(e.menu):"To be decided"])});
  if(evs.length)y=doc.lastAutoTable.finalY+6;
  if(kind==="BOOKING"){const rooms=(o.room_allocations||[]).filter(r=>r.active);
    if(rooms.length){doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",headStyles:hs,styles:st,head:[["Suite room","Check-in","Check-out","Nights"]],
      body:rooms.map(r=>["Suite "+r.room_no,fmtD(r.check_in),fmtD(r.check_out),diff(r.check_in,r.check_out)])});y=doc.lastAutoTable.finalY+6;}
  }else{const rr=evs.reduce((s,e)=>Math.max(s,e.rooms||0),0);if(rr){doc.setFontSize(10);doc.setTextColor(40,40,40);doc.text("Suite rooms requested: "+rr,M,y+1);y+=8;}}
  if(extrasAny(o.extras)){const xe=o.extras,cells=EXTRAS.map(([k,l])=>[l,xe[k]==="YES"?"Yes":xe[k]==="NO"?"No":"-"]),body=[];
    for(let i=0;i<cells.length;i+=3)body.push([...cells[i],...(cells[i+1]||["",""]),...(cells[i+2]||["",""])]);
    if(xe.other)body.push([{content:"Other: "+ascii(xe.other),colSpan:6}]);
    doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",headStyles:hs,styles:st,head:[[{content:"Requirements",colSpan:6}]],body,
      columnStyles:{1:{cellWidth:16,halign:"center",fontStyle:"bold"},3:{cellWidth:16,halign:"center",fontStyle:"bold"},5:{cellWidth:16,halign:"center",fontStyle:"bold"}},
      didParseCell:d=>{if(d.section==="body"&&d.column.index%2===1){if(d.cell.raw==="Yes")d.cell.styles.textColor=[20,120,60];if(d.cell.raw==="No")d.cell.styles.textColor=[190,40,40];}}});
    y=doc.lastAutoTable.finalY+6;}
  const amt=kind==="QUOTE"?[["Offered price",rs(x.price)]]:[["Booking amount",rs(o.total_amount)],["Amount received",rs(o.paid_amount)],["Balance payable",rs(Math.max(o.total_amount-o.paid_amount,0))]];
  doc.autoTable({startY:y,margin:{left:W-M-86,right:M},theme:"grid",styles:{...st,fontSize:10.5},body:amt,
    columnStyles:{0:{cellWidth:46},1:{halign:"right",fontStyle:"bold"}},
    didParseCell:d=>{if(d.row.index===amt.length-1){d.cell.styles.fillColor=[246,236,224];d.cell.styles.textColor=[110,32,58];d.cell.styles.fontStyle="bold";}}});
  y=doc.lastAutoTable.finalY+8;
  const para=(title,text)=>{if(!text)return;const lines=doc.splitTextToSize(ascii(text),W-2*M);
    if(y+14>284){doc.addPage();y=20;}
    doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(110,32,58);doc.text(title,M,y);y+=5;
    doc.setFont("helvetica","normal");doc.setFontSize(9.2);doc.setTextColor(60,60,60);
    for(const ln of lines){if(y>284){doc.addPage();y=20;}doc.text(ln,M,y);y+=4.6;}
    y+=5;};
  if(kind==="BOOKING"){const pays=o.payments||[];
    if(pays.length)para("PAYMENTS RECEIVED",pays.map(p=>fmtD(p.paid_on)+"   "+rs(p.amount)+"   "+p.mode+(p.note?"   "+p.note:"")).join("\n"));
    const pl=payPlan(o);if(pl.length)para("PAYMENT SCHEDULE",pl.map(m=>m.label+":  "+rs(m.need)+"  by "+fmtD(m.date)).join("\n"));
    para("SPECIAL REQUIREMENTS",o.custom_notes);
  }else{para("INCLUDED / NOTES",x.note);para("VALIDITY","This quotation is valid for "+x.valid+" days from the date above. The date is held only after advance payment.");}
  para("TERMS AND CONDITIONS",BIZ.terms);
  if(y>262){doc.addPage();y=20;}
  y=Math.max(y+10,258);doc.setDrawColor(150,150,150);doc.line(M,y,M+55,y);doc.line(W-M-55,y,W-M,y);
  doc.setFontSize(8.5);doc.setTextColor(110,110,110);doc.text("Customer signature",M,y+4.5);doc.text("For "+ascii(cap(BIZ.name||"Rosellia")),W-M,y+4.5,{align:"right"});
  doc.setFontSize(8);doc.text("Thank you for choosing "+ascii(cap(BIZ.name||"Rosellia"))+".",W/2,290,{align:"center"});
  return doc.output("blob");
}
/* PDF is built first, then a small screen offers the two sends as separate taps.
   Sending file and text together in one share is unreliable: WhatsApp on many phones keeps only the text. */
let PDFJOB=null;
function sharePDF(kind,id,x){
  if(!window.jspdf){toast("PDF tool is still loading. Check internet and try again.");return false;}
  const o=kind==="QUOTE"?leadById(id):bkById(id);if(!o)return false;
  let blob;try{blob=buildPDF(kind,o,x||{});}catch(e){toast("PDF error: "+e.message);return false;}
  const ref=o.lead_no||o.booking_no,fname=`Rosellia-${kind==="QUOTE"?"Quotation":"Booking"}-${ref}.pdf`;
  const text=kind==="QUOTE"?`Namaste ${o.customer_name} ji,\nPlease find the quotation ${ref} from ${cap(BIZ.name||"Rosellia")} ${BIZ.tagline||"Banquets & Suites"}.\nOffered price: ${inr(x.price)}\nValid for ${x.valid} days.`:bookingText(o);
  PDFJOB={file:new File([blob],fname,{type:"application/pdf"}),fname};
  sendFileModal(kind==="QUOTE"?"Quotation ready":"Booking PDF ready",o.customer_name,o.mobile,text,"pdfShare()","pdfDownload()");
  return true;
}
function canShareFile(f){try{return !!(navigator.canShare&&navigator.canShare({files:[f]}));}catch(e){return false;}}
function sendFileModal(title,name,mobile,text,shareFn,dlFn){
  const can=canShareFile(new File(["x"],"x.pdf",{type:"application/pdf"}));
  modal(`<h2>${title}</h2><p class="sub">For ${esc(name)} · ${esc(mobile)}. Two taps: first the message, then the PDF.</p>
    <div class="card glass" style="margin-top:12px"><div class="title">1. Send the message</div><div class="sub">Opens this customer's WhatsApp chat with the details typed in.</div>
      <div class="btnrow"><a class="btn btn-green" ${WA_T} href="${waLink(mobile,text)}">${icn("chat",16)} WhatsApp message</a></div></div>
    <div class="card glass"><div class="title">2. Send the PDF</div>
      <div class="sub">${can?"Tap Share PDF, choose WhatsApp, then pick the same customer. After step 1 they are at the top of the chat list.":"This browser cannot hand a file to WhatsApp. Download the PDF and attach it in the chat. For one-tap sharing, open and install this app from Google Chrome."}</div>
      <div class="btnrow">${can?`<button class="btn btn-gold" onclick="${shareFn}">${icn("file",16)} Share PDF</button>`:""}
        <button class="btn" onclick="${dlFn}">Download PDF</button></div></div>
    <div class="btnrow"><button class="btn btn-block" onclick="closeModal()">Done</button></div>`);
}
function saveBlob(blob,fname){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("PDF downloaded");}
function pdfDownload(){if(PDFJOB)saveBlob(PDFJOB.file,PDFJOB.fname);}
async function shareFile(file){
  try{await navigator.share({files:[file]});return true;}
  catch(e){if(e.name==="AbortError")return false;saveBlob(file,file.name);toast("Sharing is not available here. PDF downloaded instead.");return false;}}
function pdfShare(){if(PDFJOB)shareFile(PDFJOB.file);}

/* ================= SEND MENU ================= */
/* Menu PDFs sit next to index.html on GitHub. To add or replace one, upload a file with exactly this name. */
const MENU_FILES={GOLD:"menu-gold.pdf",PEARL:"menu-pearl.pdf",SAPPHIRE:"menu-sapphire.pdf"};
const MENU_OK={},MENU_BLOB={};let MENU_TO=null;
async function menuModal(name,mobile){
  MENU_TO=mobile?{name,mobile}:null;renderMenuModal();
  const pending=Object.keys(MENU_FILES).filter(k=>MENU_OK[k]===undefined);
  if(!pending.length)return;
  await Promise.all(pending.map(async k=>{try{const r=await fetch(MENU_FILES[k],{method:"HEAD",cache:"no-store"});MENU_OK[k]=r.ok;}catch(e){MENU_OK[k]=null;}}));
  for(const k of pending)if(MENU_OK[k]===null)delete MENU_OK[k];
  if($("menuList"))renderMenuModal(true);
}
function renderMenuModal(checked){
  const to=MENU_TO,can=canShareFile(new File(["x"],"x.pdf",{type:"application/pdf"}));
  const rows=Object.keys(MENU_FILES).map(k=>{const ok=MENU_OK[k];
    if(ok===undefined)return `<div class="card glass"><div class="title">${cap(k)} menu</div><div class="sub">${checked?"Could not check. Internet may be off.":"Checking"}</div></div>`;
    if(!ok)return isAdmin()?`<div class="card glass"><div class="title">${cap(k)} menu</div><div class="sub">Not uploaded yet. Upload a file named ${MENU_FILES[k]} to GitHub and it will appear here.</div></div>`:"";
    return `<div class="card glass"><div class="row"><span class="title">${cap(k)} menu</span><div class="sp"></div>
        ${can?`<button class="btn btn-gold btn-sm" id="mshare_${k}" onclick="menuShare('${k}')">${icn("file",15)} Send PDF</button>`
             :`<a class="btn btn-gold btn-sm" href="${MENU_FILES[k]}" download="Rosellia-${cap(k)}-Menu.pdf">Download</a>`}
        <a class="btn btn-sm" target="_blank" rel="noopener" href="${MENU_FILES[k]}">View</a></div></div>`;}).join("");
  const greet=to?`Namaste ${to.name} ji,\nSharing the menu of ${cap(BIZ.name||"Rosellia")} ${BIZ.tagline||"Banquets & Suites"} with you.`:"";
  modal(`<h2>Send menu</h2>
    ${to?`<p class="sub">To ${esc(to.name)} · ${esc(to.mobile)}</p>
      <div class="card glass" style="margin-top:12px"><div class="title">1. Open the customer's chat</div><div class="sub">So this customer comes to the top of your WhatsApp list.</div>
        <div class="btnrow"><a class="btn btn-green" ${WA_T} href="${waLink(to.mobile,greet)}">${icn("chat",16)} Open WhatsApp chat</a></div></div>
      <div class="sec">2. Send the menu PDF</div>`:`<div style="height:10px"></div>`}
    <div id="menuList">${rows}</div>
    <div class="sub">${can?"Send PDF opens the share sheet: choose WhatsApp, then the customer. The real PDF file is sent.":"This browser cannot hand a file to WhatsApp. Download the menu and attach it in the chat. For one-tap sharing, open and install this app from Google Chrome."}</div>
    <div class="btnrow"><button class="btn btn-block" onclick="closeModal()">Done</button></div>`);
}
async function menuShare(k){
  const btn=$("mshare_"+k);
  if(!MENU_BLOB[k]){
    if(btn){btn.disabled=true;btn.textContent="Preparing menu";}
    try{const r=await fetch(MENU_FILES[k]);if(!r.ok)throw new Error("not found");
      MENU_BLOB[k]=new File([await r.blob()],`Rosellia-${cap(k)}-Menu.pdf`,{type:"application/pdf"});}
    catch(e){toast("Could not load the menu. Check internet.");if(btn){btn.disabled=false;btn.innerHTML=icn("file",15)+" Send PDF";}return;}
    if(btn){btn.disabled=false;btn.innerHTML=icn("file",15)+" Send PDF";}
  }
  try{await navigator.share({files:[MENU_BLOB[k]]});}
  catch(e){if(e.name==="NotAllowedError"){if(btn)btn.innerHTML=icn("file",15)+" Ready: tap again";toast("Menu is ready. Tap the button once more.");}
    else if(e.name!=="AbortError")toast("Sharing is not available in this browser. Use Google Chrome.");}
}

/* ================= YES / NO REQUIREMENTS ================= */
const EXTRAS=[["onion","Onion"],["garlic","Garlic"],["jaimala","Jaimala"],["milni","Milni Haar"],["mandap","Mandap"],["dj","DJ"],["valet","Valet Parking"],["liquor","Liquor License"],["balloon","Balloon Decor"]];
let XS=null;
function extrasEdit(obj){XS=obj;
  return `<div class="xgrid">${EXTRAS.map(([k,l])=>`<div class="xrow"><span>${l}</span><div class="yn">
      <button type="button" id="xy_${k}" class="y ${obj[k]==="YES"?"on":""}" onclick="xSet('${k}','YES')">Yes</button>
      <button type="button" id="xn_${k}" class="n ${obj[k]==="NO"?"on":""}" onclick="xSet('${k}','NO')">No</button></div></div>`).join("")}</div>
    <label>Any other requirement</label><input id="xOther" value="${esc(obj.other||"")}" oninput="XS.other=this.value" placeholder="Write here">`;}
function xSet(k,v){if(!XS)return;if(XS[k]===v)delete XS[k];else XS[k]=v;
  $("xy_"+k).classList.toggle("on",XS[k]==="YES");$("xn_"+k).classList.toggle("on",XS[k]==="NO");}
function extrasClean(x){const o={};for(const [k] of EXTRAS)if(x&&(x[k]==="YES"||x[k]==="NO"))o[k]=x[k];const t=String(x?.other||"").trim();if(t)o.other=t;return o;}
function extrasAny(x){return !!x&&(EXTRAS.some(([k])=>x[k])||!!x.other);}
function extrasView(x){if(!extrasAny(x))return `<div class="sub" style="margin:0 2px 10px">Not filled yet.</div>`;
  return `<div class="card glass"><div class="row wrap" style="gap:6px">${EXTRAS.filter(([k])=>x[k]).map(([k,l])=>`<span class="chip ${x[k]==="YES"?"ch-green":"ch-red"}" style="font-size:11.5px;padding:6px 10px">${l.toUpperCase()}: ${x[k]}</span>`).join("")}</div>
    ${x.other?`<div class="meta" style="color:var(--text)"><b>Other:</b> ${esc(x.other)}</div>`:""}</div>`;}
function extrasText(x){if(!extrasAny(x))return"";
  return EXTRAS.filter(([k])=>x[k]).map(([k,l])=>l+": "+cap(x[k])).join(", ")+(x.other?(EXTRAS.some(([k])=>x[k])?", ":"")+"Other: "+x.other:"");}

/* ================= PAYMENT SCHEDULE AND REMINDERS ================= */
/* From the terms: 25% at booking, total 75% one month before the event, 100% two days before. */
const PAY_PLAN=[[25,"Advance (25%)",null],[75,"Second payment (total 75%)",30],[100,"Final balance",2]];
function payPlan(b){const ev=(b.booking_events||[]).filter(e=>e.active).map(e=>e.event_date).sort()[0];
  if(!ev){const ci=bkRooms(b).map(r=>r.check_in).sort()[0];return ci&&isRoomOnly(b)?[{pct:100,label:"Room payment",date:ci<b.booking_date?b.booking_date:ci,need:Math.round(b.total_amount)}]:[];}
  return PAY_PLAN.map(([pct,label,days])=>{let date=days==null?b.booking_date:addDays(ev,-days);if(date<b.booking_date)date=b.booking_date;
    return {pct,label,date,need:Math.round(b.total_amount*pct/100)};});}
function payDue(b){if(b.status==="CANCELLED")return null;
  for(const m of payPlan(b))if(b.paid_amount<m.need-0.5)return {...m,amount:m.need-b.paid_amount,late:diff(m.date,T())};
  return null;}
function dueBookings(days){const lim=addDays(T(),days);
  return bookings.map(b=>({b,d:payDue(b)})).filter(x=>x.d&&x.d.date<=lim).sort((a,c)=>a.d.date<c.d.date?-1:1);}
function dueChip(d){return d.late>0?`<span class="chip ch-red">DUE ${d.late}D AGO</span>`:d.late===0?`<span class="chip ch-amber">DUE TODAY</span>`:`<span class="chip ch-blue">DUE ${fmtDs(d.date).toUpperCase()}</span>`;}
function reminderText(b,d){const e=(b.booking_events||[]).filter(x=>x.active)[0];
  return `Namaste ${b.customer_name} ji,\nGreetings from ${cap(BIZ.name||"Rosellia")} ${BIZ.tagline||"Banquets & Suites"}.\n\nThis is a gentle reminder regarding your booking ${b.booking_no}${e?` (${cap(e.event_type)} on ${fmtD(e.event_date)})`:""}.\nAs per the payment schedule, an amount of *${inr(d.amount)}* ${d.late>0?"was due on":"is due by"} ${fmtD(d.date)}.\n\nBooking amount: ${inr(b.total_amount)}\nReceived so far: ${inr(b.paid_amount)}\nBalance: ${inr(Math.max(b.total_amount-b.paid_amount,0))}\n\nKindly ignore this message if the payment has already been made.\nThank you for choosing ${cap(BIZ.name||"Rosellia")}. We look forward to hosting you.${BIZ.phone?"\nContact: "+BIZ.phone:""}`;}

/* ================= PAYMENT RECEIPT ================= */
function inWords(n){n=Math.round(Number(n)||0);if(n===0)return"Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],
        t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=>x<20?a[x]:t[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three=x=>(x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");
  let s="";const cr=Math.floor(n/1e7),lk=Math.floor(n%1e7/1e5),th=Math.floor(n%1e5/1e3),r=n%1e3;
  if(cr)s+=three(cr)+" Crore ";if(lk)s+=two(lk)+" Lakh ";if(th)s+=two(th)+" Thousand ";if(r)s+=three(r);
  return s.trim();}
function receiptNo(b,p){return b.booking_no+"/R"+((b.payments||[]).findIndex(x=>x.id===p.id)+1);}
function buildReceipt(b,p){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});const W=210,M=14;
  pdfHeader(doc,W,M);
  let y=48;doc.setTextColor(110,32,58);doc.setFont("times","bold");doc.setFontSize(17);doc.text("PAYMENT RECEIPT",M,y);
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(60,60,60);
  doc.text("Receipt No: "+receiptNo(b,p),W-M,y-4,{align:"right"});doc.text("Date: "+fmtD(p.paid_on),W-M,y+1,{align:"right"});
  y+=9;doc.setDrawColor(220,205,190);doc.line(M,y,W-M,y);y+=7;
  doc.setFontSize(9);doc.setTextColor(120,120,120);doc.text("RECEIVED WITH THANKS FROM",M,y);y+=5.5;
  doc.setFontSize(12.5);doc.setTextColor(30,30,30);doc.setFont("helvetica","bold");doc.text(ascii(b.customer_name)||"Customer",M,y);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text("Mobile: "+b.mobile,M,y+5.5);y+=13;
  const st={fontSize:10.5,cellPadding:3,lineColor:[225,212,200],lineWidth:0.2};
  const idx=(b.payments||[]).findIndex(x=>x.id===p.id);
  const paidTill=(b.payments||[]).slice(0,idx+1).reduce((s,x)=>s+ +x.amount,0);
  const evs=(b.booking_events||[]).filter(e=>e.active).map(e=>cap(e.event_type)+" on "+fmtD(e.event_date)+", "+HALLS[e.hall].name+", "+cap(e.session)).join("\n");
  doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",styles:st,columnStyles:{0:{cellWidth:52,textColor:[110,110,110]},1:{fontStyle:"bold"}},
    body:[["Amount received",rs(p.amount)],["Amount in words","Rupees "+inWords(p.amount)+" Only"],["Payment mode",ascii(p.mode)+(p.note?"  ("+ascii(p.note)+")":"")],
      ["Against booking",b.booking_no],[evs?"Event":"Stay",ascii(evs)||bkRooms(b).map(r=>"Suite "+r.room_no+": "+fmtD(r.check_in)+" to "+fmtD(r.check_out)).join("\n")||"-"]],
    didParseCell:d=>{if(d.row.index===0){d.cell.styles.fillColor=[246,236,224];d.cell.styles.textColor=[110,32,58];d.cell.styles.fontSize=12.5;}}});
  y=doc.lastAutoTable.finalY+7;
  doc.autoTable({startY:y,margin:{left:W-M-86,right:M},theme:"grid",styles:st,columnStyles:{0:{cellWidth:46},1:{halign:"right",fontStyle:"bold"}},
    body:[["Booking amount",rs(b.total_amount)],["Total received till this receipt",rs(paidTill)],["Balance payable",rs(Math.max(b.total_amount-paidTill,0))]]});
  y=Math.max(doc.lastAutoTable.finalY+30,150);
  doc.setDrawColor(150,150,150);doc.line(W-M-55,y,W-M,y);doc.setFontSize(8.5);doc.setTextColor(110,110,110);
  doc.text("For "+ascii(cap(BIZ.name||"Rosellia")),W-M,y+4.5,{align:"right"});doc.text("Authorised signatory",W-M,y+9,{align:"right"});
  doc.setFontSize(8);doc.text("This is a computer generated receipt. Advance once paid is non-refundable as per terms.",M,y+9);
  return doc.output("blob");
}

function lostSuggest(l){if(l.status!=="ACTIVE")return null;const t=T();
  if(l.snooze_until&&l.snooze_until>t)return null;
  const ds=(l.lead_events||[]).map(e=>e.event_date).filter(Boolean);
  if(ds.length&&ds.every(d=>d<t))return "Event date has already passed";
  if((l.fu_count||0)>=6)return (l.fu_count)+" follow-ups done, still no decision";
  const s=fuState(l);if(s&&s.late>=10)return "Follow-up pending for "+s.late+" days";
  const last=(l.last_contact_at||l.created_at).slice(0,10);if(diff(last,t)>=30)return "No contact logged for "+diff(last,t)+" days";
  return null;}

    const wb=XLSX.utils.book_new();
    for(const [name,rows] of Object.entries(sheets)){const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"No data":""}]);
      const keys=Object.keys(rows[0]||{"No data":""});ws["!cols"]=keys.map(k=>({wch:Math.min(40,Math.max(k.length+2,...rows.slice(0,200).map(r=>String(r[k]??"").length+2)))}));

    ${hasPower("bookings")?`<button class="btn btn-rose btn-block" style="margin-bottom:10px;padding:14px" onclick="roomBookModal()">${icn("bed",17)} Book rooms directly</button>`:""}
    <div class="card glass"><div class="sec" style="margin-top:0">Check room availability</div>
      <div class="g2"><div><label>Check-in</label><input type="date" value="${rmCi}" onchange="rmCi=this.value;if(!rmCo||rmCo<=rmCi)rmCo=addDays(rmCi,1);renderRooms()"></div>
      <div><label>Check-out</label><input type="date" value="${rmCo}" onchange="rmCo=this.value;renderRooms()"></div></div>
      ${ok?`<div class="hint ${ROOMS-Object.keys(taken).length?"h-green":"h-red"}">${ROOMS-Object.keys(taken).length} of ${ROOMS} suites free for ${diff(rmCi,rmCo)} night${diff(rmCi,rmCo)>1?"s":""}</div>
        <div class="rooms">${Array.from({length:ROOMS},(_,k)=>k+1).map(x=>taken[x]?`<div class="rm taken">${x}<small>${esc(taken[x].customer_name)}</small></div>`:`<div class="rm">${x}<small>Free</small></div>`).join("")}</div>`:""}
    </div>
    <div class="rgridwrap glass"><table class="rgrid"><tr><th class="rn">Room</th>${Array.from({length:n},(_,i)=>{const dw=new Date(calY,calM,i+1).getDay();return `<th class="${dw===0||dw===6?"we":""}">${i+1}</th>`;}).join("")}</tr>
      ${Array.from({length:ROOMS},(_,k)=>k+1).map(r=>`<tr><td class="rn">Suite ${r}</td>${Array.from({length:n},(_,i)=>{const b=grid[r+"_"+(i+1)];
        return b?`<td class="bk" title="${esc(b.customer_name)}" onclick="nav('booking','${b.id}')"></td>`:`<td></td>`;}).join("")}</tr>`).join("")}</table></div>
    <div class="legend"><span><i style="background:#d0577a"></i>Occupied night (tap to open booking)</span><span><i style="background:var(--green-s)"></i>Free</span></div>
    <div class="sub">Each box is one night. A room booked from 20th to 22nd is occupied on the nights of 20 and 21, and free again from the 22nd.</div>
  </div>`;
}

/* ================= REPORTS ================= */
let repRange="FY";
function renderReports(){
  $("hdrTitle").textContent="Reports";
  if(!isAdmin()){app.innerHTML=`<div class="empty">Admin only</div>`;return;}
  const now=new Date(),fyStart=(now.getMonth()>=3?now.getFullYear():now.getFullYear()-1)+"-04-01",mStart=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-01";
  const from=repRange==="FY"?fyStart:repRange==="MONTH"?mStart:"0000";
  const L=leads.filter(l=>l.created_at.slice(0,10)>=from),B=bookings.filter(b=>b.booking_date>=from&&b.status!=="CANCELLED");
  const conv=L.filter(l=>l.status==="CONVERTED").length,lost=L.filter(l=>l.status==="LOST").length,act=L.filter(l=>l.status==="ACTIVE").length;
  const tot=B.reduce((s,b)=>s+ +b.total_amount,0),paid=B.reduce((s,b)=>s+ +b.paid_amount,0);
  const pipe=L.filter(l=>l.status==="ACTIVE").reduce((s,l)=>s+ +(l.offered_price||0),0);
  const group=(arr,fn)=>{const m={};arr.forEach(x=>{const k=fn(x)||"NOT SET";m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const bars=(rows,total)=>rows.length?rows.map(([k,v,extra])=>`<div style="margin-bottom:10px"><div class="row"><span style="font-size:12.5px;font-weight:600">${esc(cap(k))}</span><div class="sp"></div><span class="sub">${v}${extra||""}</span></div>
    <div class="bar"><i style="width:${total?Math.round(v/total*100):0}%"></i></div></div>`).join(""):`<div class="sub">No data yet.</div>`;
  const src=group(L,l=>l.source).map(([k,v])=>{const c=L.filter(l=>l.source===k&&l.status==="CONVERTED").length;return [k,v,` leads · ${c} booked (${Math.round(c/v*100)}%)`];});
  const staff=group(L,l=>pname(l.assigned_to)).map(([k,v])=>{const c=L.filter(l=>pname(l.assigned_to)===k&&l.status==="CONVERTED").length;return [k,v,` leads · ${c} booked`];});
  app.innerHTML=`<div class="page">
    <div class="tabs">${[["MONTH","This month"],["FY","This financial year"],["ALL","All time"]].map(([k,l])=>`<button class="tab ${repRange===k?"on":""}" onclick="repRange='${k}';renderReports()">${l}</button>`).join("")}</div>
    <div class="stats"><div class="stat glass"><b>${L.length}</b><span>Leads</span></div><div class="stat glass"><b>${conv}</b><span>Booked</span></div>
      <div class="stat glass"><b>${lost}</b><span>Lost</span></div><div class="stat glass"><b>${L.length?Math.round(conv/L.length*100):0}%</b><span>Conversion</span></div></div>
    <div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat glass"><b>${inr(tot)}</b><span>Booked value</span></div><div class="stat glass"><b style="color:var(--green)">${inr(paid)}</b><span>Collected</span></div>
      <div class="stat glass"><b style="color:var(--red)">${inr(Math.max(tot-paid,0))}</b><span>Outstanding</span></div><div class="stat glass"><b>${inr(pipe)}</b><span>Open pipeline (${act})</span></div></div>
    <div class="sec">Lead sources</div><div class="card glass">${bars(src,L.length)}</div>
    <div class="sec">Why leads were lost</div><div class="card glass">${bars(group(L.filter(l=>l.status==="LOST"),l=>l.lost_reason),lost)}</div>
    <div class="sec">Event types</div><div class="card glass">${bars(group(L.flatMap(l=>l.lead_events||[]),e=>e.event_type),L.flatMap(l=>l.lead_events||[]).length)}</div>
    <div class="sec">Team</div><div class="card glass">${bars(staff,L.length)}</div>
  </div>`;
}

/* ================= TEAM ================= */
function renderTeam(){
  $("hdrTitle").textContent="Team";
  if(!isOwner()){app.innerHTML=`<div class="empty">Owner only</div>`;return;}
  app.innerHTML=`<div class="page">
    <div class="sub" style="margin-bottom:12px">To add a new login: Supabase, Authentication, Users, Add user (tick Auto Confirm). The person appears here on their own as Staff. Owner and Manager have all powers.</div>
    ${profiles.map(p=>`<div class="card glass">
      <div class="row"><span class="title">${esc(p.name)||"(no name)"}</span><div class="sp"></div>
        <span class="chip ${p.role==="owner"?"ch-rose":p.role==="manager"?"ch-blue":"ch-gray"}">${p.role.toUpperCase()}</span>
        <span class="chip ${p.active?"ch-green":"ch-red"}" style="cursor:pointer" onclick="toggleActive('${p.id}')">${p.active?"ACTIVE":"OFF"}</span></div>
      <div class="sub">${esc(p.email||"")}</div>
      <div class="g2"><div><label>Name</label><input id="nm_${p.id}" value="${esc(p.name)}"></div>
      <div><label>Telegram ID</label><input id="tg_${p.id}" value="${esc(p.telegram_chat_id||"")}" placeholder="from @userinfobot" inputmode="numeric"></div></div>
      <div class="btnrow"><button class="btn btn-sm" onclick="saveMember('${p.id}')">Save name and Telegram</button></div>
      ${p.id!==me.id?`<label>Role</label><select onchange="setRole('${p.id}',this.value)">${opts(["staff","manager","owner"],p.role)}</select>`:""}
      ${p.role==="staff"?`<label>Powers</label><div class="row wrap" style="gap:6px">${POWER_DEFS.map(([k,l])=>`<button class="tab ${p.powers?.[k]?"on":""}" onclick="togglePower('${p.id}','${k}')">${l}</button>`).join("")}</div>`:""}
    </div>`).join("")}</div>`;
}
async function profUpdate(id,patch,msg){const {error}=await sb.from("profiles").update(patch).eq("id",id);if(error)return toast(error.message);await loadData();if(msg)toast(msg);renderTeam();}
const saveMember=id=>profUpdate(id,{name:$("nm_"+id).value.trim(),telegram_chat_id:$("tg_"+id).value.trim()||null},"Saved");
const setRole=(id,role)=>profUpdate(id,{role},"Role updated");
function togglePower(id,k){const p=profiles.find(x=>x.id===id);profUpdate(id,{powers:{...(p.powers||{}),[k]:!p.powers?.[k]}});}
function toggleActive(id){const p=profiles.find(x=>x.id===id);if(p.id===me.id)return toast("You cannot switch yourself off");profUpdate(id,{active:!p.active});}

/* ================= SETTINGS ================= */
function renderSettings(){
  $("hdrTitle").textContent="Settings";
  if(!isAdmin()){app.innerHTML=`<div class="empty">Admin only</div>`;return;}
  const s=BIZ,F=(k,l,ph="")=>`<label>${l}</label><input id="st_${k}" value="${esc(s[k]||"")}" placeholder="${ph}">`;
  app.innerHTML=`<div class="page">
    <div class="card glass"><div class="sec" style="margin-top:0">Business details (printed on PDF)</div>
      ${F("name","Business name")}${F("tagline","Tagline")}${F("phone","Phone numbers")}
      <label>Address</label><textarea id="st_address">${esc(s.address||"")}</textarea>${F("gstin","GSTIN")}
      ${F("review_link","Google review link (sent to customers after the event)","https://g.page/r/...")}
      <label>Terms and conditions (printed on quotation and booking PDF)</label><textarea id="st_terms" style="min-height:130px">${esc(s.terms||"")}</textarea>
      <div class="btnrow"><button class="btn btn-rose" onclick="saveSettings()">Save settings</button></div></div>
    <div class="card glass"><div class="sec" style="margin-top:0">Data backup (Excel)</div>
      <div class="sub">${BACKUP?.at?"Last backup: "+fmtD(BACKUP.at)+(BACKUP.by?" by "+esc(BACKUP.by):"")+" ("+backupAge()+" days ago).":"No backup taken yet."} The home screen reminds you every 10 days. Keep the file in Google Drive or email it to yourself.</div>
      <div class="btnrow"><button class="btn btn-gold" onclick="doBackup()">${icn("file",16)} Download Excel backup now</button></div></div>
    <div class="card glass"><div class="sec" style="margin-top:0">Telegram</div>
      <div class="sub">After running telegram.sql and saving your Telegram ID in Team, press the button to test.</div>
      <div class="btnrow"><button class="btn" onclick="tgTest()">Send test message to me</button></div></div>
    <p class="sub" style="text-align:center">Rosellia app v${APP_VERSION}</p></div>`;
}
async function saveSettings(){const v={...BIZ};for(const k of ["name","tagline","phone","address","gstin","review_link","terms"])v[k]=$("st_"+k).value.trim();
  const {error}=await sb.from("settings").update({value:v}).eq("key","business");if(error)return toast(error.message);BIZ=v;toast("Settings saved");}
async function tgTest(){const {data,error}=await sb.rpc("tg_test");toast(error?"Telegram is not set up yet. Run telegram.sql first.":data);}

/* ---------- start ---------- */
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
</script>
</body>
